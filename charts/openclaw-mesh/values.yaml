replicaCount: 1

image:
  repository: ghcr.io/samajesteduroyaume/openclaw-mesh
  pullPolicy: IfNotPresent
  tag: "1.2.0"

service:
  type: ClusterIP
  httpPort: 8000
  p2pPort: 8765
  udpPort: 8766

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mesh.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 2000m
    memory: 4096Mi
  requests:
    cpu: 500m
    memory: 1024Mi

persistence:
  enabled: true
  size: 10Gi
  storageClassName: ""

env:
  OPENCLAW_HOST: "0.0.0.0"
  OPENCLAW_PORT: "8000"
  OPENCLAW_ENABLE_ZEROCONF: "false"
