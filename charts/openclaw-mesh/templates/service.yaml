apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.p2pPort }}
      targetPort: p2p-ws
      protocol: TCP
      name: p2p-ws
    - port: {{ .Values.service.udpPort }}
      targetPort: p2p-quic
      protocol: UDP
      name: p2p-quic
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
