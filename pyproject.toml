[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-mesh"
version = "1.1.0"
description = "OpenClaw P2P Mesh Skill & Protocol Bridge — Seamless decentralized AI collaboration compatible with JarvisMesh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "OpenClawMesh Contributors" }
]
keywords = ["openclaw", "jarvismesh", "p2p", "ai-agents", "mesh", "decentralized", "mlx", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Networking",
]

dependencies = [
    "websockets==17.1",
    "zeroconf==0.150.0",
    "cryptography==50.0.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "qrcode==8.2",
    "fastapi==0.141.1",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
crypto = [
    "cryptography==50.0.1",
]
rich = [
    "rich==14.2.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "cryptography==50.0.1",
    "rich==14.2.0",
    "mypy>=1.8.0",
    "ruff>=0.4.0",
    "black>=24.3.0,<26.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.5.0",
]
all = [
    "cryptography==50.0.1",
    "rich==14.2.0",
]
gateway = [
    "fastapi==0.141.1",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
openclaw-mesh = "openclaw_mesh.cli:main"

[tool.setuptools.packages.find]
include = ["openclaw_mesh*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "websockets.*",
    "zeroconf.*",
    "qrcode.*",
    "rich.*",
    "torch.*",
    "transformers.*",
    "mlx_lm.*",
    "openvino_genai.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*" = ["E402"]
"examples/*" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3