[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-mesh"
version = "1.0.0"
description = "OpenClaw P2P Mesh Skill & Protocol Bridge — Seamless decentralized AI collaboration compatible with JarvisMesh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "OpenClawMesh Contributors" }
]
keywords = ["openclaw", "jarvismesh", "p2p", "ai-agents", "mesh", "decentralized", "mlx", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Networking",
]

dependencies = [
    "websockets>=12.0",
    "zeroconf>=0.131.0",
]

[project.optional-dependencies]
crypto = [
    "cryptography>=41.0.0",
]
rich = [
    "rich>=13.0.0",
]
validation = [
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "cryptography>=41.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]
all = [
    "cryptography>=41.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
openclaw-mesh = "openclaw_mesh.cli:main"
