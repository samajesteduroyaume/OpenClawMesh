name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[all,gateway,dev]"

      - name: Run tests
        env:
          GATEWAY_DB_PATH: ${{ runner.temp }}/openclaw_keys.db
        run: pytest -q

      - name: Check changed runtime files
        run: ruff check openclaw_mesh
